<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
{{- /* While the site is still served from github.io it is a duplicate of the live site: keep it out of Google.
       Flips automatically once baseURL is changed to the real domain. */ -}}
{{- if in site.BaseURL "github.io" }}
<meta name="robots" content="noindex, nofollow">
{{- end }}
