{{- /* Right sidebar: search box + category list, as on the old site. */ -}}
<aside class="sidebar">
    <section class="widget widget-search">
        <form action="{{ "search/" | relLangURL }}" method="get" role="search">
            <label for="sidebar-search">検索</label>
            <div class="search-row">
                <input id="sidebar-search" type="search" name="q" autocomplete="off">
                <button type="submit">検索</button>
            </div>
        </form>
    </section>
    <section class="widget widget-categories">
        <h3>カテゴリー</h3>
        <ul>
            {{- /* Most-used categories first; each shows its post count on the right. */ -}}
            {{- range site.Taxonomies.categories.ByCount }}
            <li>
                <a href="{{ .Page.RelPermalink }}">
                    <span class="term-name">{{ .Page.Title }}</span>
                    <span class="term-count">{{ .Count }}</span>
                </a>
            </li>
            {{- end }}
        </ul>
    </section>
</aside>
