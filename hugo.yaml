# Site configuration — see README.md for how to add posts.
baseURL: https://despertando-nihongo.github.io/   # change to https://www.despertando-nihongo.com/ when the domain moves
title: デスペルタンド 日本語
languageCode: ja
defaultContentLanguage: ja
hasCJKLanguage: true
theme: PaperMod
timeZone: Asia/Tokyo
enableRobotsTXT: true
buildDrafts: false

pagination:
  pagerSize: 10

# Existing posts carry their old WordPress URL in front matter (`url:`).
# New posts get /<slug or title>/ automatically.
permalinks:
  posts: /:slug/

taxonomies:
  category: categories
  tag: tags

outputs:
  home: [HTML, RSS, JSON]   # JSON feeds the search page

# Keep the WordPress feed URL (/feed/) so existing RSS subscribers are not lost.
outputFormats:
  RSS:
    baseName: index
    path: feed
    mediaType: application/rss+xml

minify:
  disableXML: true

markup:
  goldmark:
    parser:
      attribute:
        block: true   # lets a paragraph be followed by {.alt} to mark the other speaker
    renderer:
      unsafe: true

params:
  env: production
  assets:
    theme_color: "#b401c4"
  description: 光のメッセージ
  defaultTheme: light
  disableThemeToggle: true
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: false
  ShowToc: false
  ShowRssButtonInSectionTermList: true
  disableSpecial1stPost: true
  hideSummary: true
  comments: false
  mainSections: [posts]
  cover:
    hiddenInList: false
    hiddenInSingle: false
    linkFullImages: false
  fuseOpts:
    isCaseSensitive: false
    threshold: 0.3
    minMatchCharLength: 1
    keys: [title, content, summary]
  DateFormat: "January 2, 2006"

menu:
  main:
    - identifier: search
      name: 検索
      url: /search/
      weight: 10
    - identifier: categories
      name: カテゴリー
      url: /categories/
      weight: 20
    - identifier: archives
      name: アーカイブ
      url: /archives/
      weight: 40
